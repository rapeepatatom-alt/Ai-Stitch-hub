<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #e3e3e3;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #c4c7c5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #a8c7fa;
            color: #001d35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .welcome-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .gemini-star {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
        }

        .welcome-text {
            font-size: 2rem;
            font-weight: 500;
            background: linear-gradient(to right, #4b90ff, #ff5546);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-stream {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 20px;
            align-self: flex-start;
            padding-bottom: 20px;
        }

        .chat-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .chat-bubble.user {
            background-color: #282a2c;
            color: #e3e3e3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.ai {
            background-color: transparent;
            color: #e3e3e3;
            align-self: flex-start;
            padding-left: 0;
        }

        .input-wrapper {
            padding: 16px 20px 24px 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .input-container {
            background-color: #1e1f20;
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 16px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 1px solid #333435;
        }

        .input-container input {
            flex: 1;
            background: none;
            border: none;
            color: #e3e3e3;
            font-size: 1rem;
            outline: none;
            padding: 8px 0;
        }

        .input-container input::placeholder {
            color: #8e918f;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: #333435;
        }

        .send-btn {
            background-color: #a8c7fa;
            color: #001d35;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn">☰</button>
            <div class="logo-text">
                Gemini <span style="font-size: 0.8rem; color: #8e918f;">อัตโนมัติ ▾</span>
            </div>
        </div>
        <div class="header-right">
            <div class="avatar">R</div>
        </div>
    </header>

    <div class="main-container" id="mainContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="gemini-star"></div>
            <div class="welcome-text">มีไอเดียใหม่ๆ น่าสำรวจไหม</div>
        </div>
        <div class="chat-stream" id="chatStream"></div>
    </div>

    <div class="input-wrapper">
        <div class="input-container">
            <button class="icon-btn">＋</button>
            <input type="text" id="userInput" placeholder="ถาม Gemini" onkeypress="handleKeyPress(event)">
            <div class="input-actions">
                <button class="icon-btn">🎤</button>
                <button class="icon-btn send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            document.getElementById('welcomeScreen').style.display = 'none';
            const chatStream = document.getElementById('chatStream');
            chatStream.style.display = 'flex';

            appendMessage(text, 'user');
            inputField.value = '';

            const aiBubble = appendMessage('กำลังคิด...', 'ai');

            // จำลองการประมวลผลคำตอบแบบสมจริง
            setTimeout(() => {
                aiBubble.innerText = `นี่คือการตอบกลับจากระบบจำลองสำหรับข้อความ: "${text}" 🌟\n\nเว็บแอปพลิเคชันของคุณทำงานบน GitHub Pages ได้อย่างสมบูรณ์แบบแล้วครับ!`;
                const mainContainer = document.getElementById('mainContainer');
                mainContainer.scrollTop = mainContainer.scrollHeight;
            }, 1000);
        }

        function appendMessage(text, sender) {
            const chatStream = document.getElementById('chatStream');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerText = text;
            chatStream.appendChild(bubble);
            
            const mainContainer = document.getElementById('mainContainer');
            mainContainer.scrollTop = mainContainer.scrollHeight;
            return bubble;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>

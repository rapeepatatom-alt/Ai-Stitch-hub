<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn, .action-btn {
            background: none;
            border: none;
            color: #e3e3e3;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #c4c7c5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #a8c7fa;
            color: #001d35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .settings-btn {
            background: #282a2c;
            border: none;
            color: #e3e3e3;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Main Container / Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .welcome-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Gemini Star Icon */
        .gemini-star {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
        }

        .welcome-text {
            font-size: 2rem;
            font-weight: 500;
            background: linear-gradient(to right, #4b90ff, #ff5546);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Chat History Stream */
        .chat-stream {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 20px;
            align-self: flex-start;
            padding-bottom: 20px;
        }

        .chat-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .chat-bubble.user {
            background-color: #282a2c;
            color: #e3e3e3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.ai {
            background-color: transparent;
            color: #e3e3e3;
            align-self: flex-start;
            padding-left: 0;
        }

        /* Input Area (Bottom Bar) */
        .input-wrapper {
            padding: 16px 20px 24px 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .input-container {
            background-color: #1e1f20;
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 16px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 1px solid #333435;
        }

        .input-container input {
            flex: 1;
            background: none;
            border: none;
            color: #e3e3e3;
            font-size: 1rem;
            outline: none;
            padding: 8px 0;
        }

        .input-container input::placeholder {
            color: #8e918f;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: #333435;
        }

        .send-btn {
            background-color: #a8c7fa;
            color: #001d35;
            border-radius: 50%;
        }

        .send-btn:hover {
            background-color: #c2d7ff;
        }

        /* API Key Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e1f20;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid #333435;
        }
        .modal-content input {
            padding: 10px;
            background: #131314;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            outline: none;
        }
        .modal-content button {
            background: #a8c7fa;
            color: #001d35;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="menu-btn">☰</button>
            <div class="logo-text">
                Gemini <span style="font-size: 0.8rem; color: #8e918f;">อัตโนมัติ ▾</span>
            </div>
        </div>
        <div class="header-right">
            <button class="settings-btn" onclick="openModal()">ตั้งค่า API Key</button>
            <div class="avatar">R</div>
        </div>
    </header>

    <!-- Main Screen -->
    <div class="main-container" id="mainContainer">
        <!-- หน้าแรกตอนยังไม่พิมพ์ -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="gemini-star"></div>
            <div class="welcome-text">มีไอเดียใหม่ๆ น่าสำรวจไหม</div>
        </div>

        <!-- หน้าแชทเมื่อเริ่มส่งข้อความ -->
        <div class="chat-stream" id="chatStream"></div>
    </div>

    <!-- Input Bar -->
    <div class="input-wrapper">
        <div class="input-container">
            <button class="icon-btn" title="เพิ่มไฟล์หรือรูปภาพ">＋</button>
            <input type="text" id="userInput" placeholder="ถาม Gemini" onkeypress="handleKeyPress(event)">
            <div class="input-actions">
                <button class="icon-btn" title="ใช้เสียง">🎤</button>
                <button class="icon-btn send-btn" onclick="sendMessage()" title="ส่ง">➔</button>
            </div>
        </div>
    </div>

    <!-- Modal ตั้งค่า API Key -->
    <div class="modal" id="apiKeyModal">
        <div class="modal-content">
            <h3>ใส่ Google Gemini API Key</h3>
            <p style="font-size: 0.85rem; color: #aaa;">คีย์นี้จะถูกเก็บบันทึกไว้ในเบราว์เซอร์ของคุณเท่านั้น ปลอดภัยแน่นอน</p>
            <input type="password" id="apiKeyInput" placeholder="วาง Gemini API Key ที่นี่...">
            <button onclick="saveApiKey()">บันทึก</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        function openModal() {
            document.getElementById('apiKeyModal').style.display = 'flex';
            document.getElementById('apiKeyInput').value = apiKey;
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            document.getElementById('apiKeyModal').style.display = 'none';
            alert('บันทึก API Key เรียบร้อยแล้ว!');
        }

        // ถ้ายังไม่มี API Key ตอนเข้าเว็บ ให้เด้งเตือนให้ใส่ (หรือจะกดปุ่มมุมบนขวาเองก็ได้)
        window.onload = function() {
            if (!apiKey) {
                // เปิด Modal อัตโนมัติครั้งแรก
                setTimeout(openModal, 500);
            }
        };

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert('กรุณาตั้งค่า Gemini API Key ที่มุมบนขวาก่อนใช้งานครับ!');
                openModal();
                return;
            }

            // ซ่อนหน้าต้อนรับ แสดงหน้าแชท
            document.getElementById('welcomeScreen').style.display = 'none';
            const chatStream = document.getElementById('chatStream');
            chatStream.style.display = 'flex';

            // เพิ่มข้อความผู้ใช้
            appendMessage(text, 'user');
            inputField.value = '';

            // สร้างช่องแชทของ AI (สถานะกำลังคิด)
            const aiBubble = appendMessage('กำลังคิด...', 'ai');

            try {
                // เรียกใช้งาน Gemini API (gemini-1.5-flash)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiBubble.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    aiBubble.innerText = "เกิดข้อผิดพลาดในการตอบกลับ กรุณาตรวจสอบ API Key อีกครั้ง";
                }
            } catch (error) {
                aiBubble.innerText = "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ Gemini ได้ในขณะนี้";
            }

            const mainContainer = document.getElementById('mainContainer');
            mainContainer.scrollTop = mainContainer.scrollHeight;
        }

        function appendMessage(text, sender) {
            const chatStream = document.getElementById('chatStream');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerText = text;
            chatStream.appendChild(bubble);
            
            const mainContainer = document.getElementById('mainContainer');
            mainContainer.scrollTop = mainContainer.scrollHeight;
            return bubble;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
